<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#000;overflow:hidden}
  svg{display:block}
  text{font-family:'Inter','Inter Display',sans-serif}
  .lbl{font-size:15px;letter-spacing:.22em;fill:#cfe6ff}
  .mono{font-family:'DejaVu Sans Mono',monospace;font-size:13px;letter-spacing:.12em;fill:#7fbfe6}
</style>
<script src="assets/geo.js"></script>
</head><body>
<svg id="s" width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="spot" cx="50%" cy="44%" r="62%">
    <stop offset="0" stop-color="#23262c"/><stop offset=".55" stop-color="#0d0e11"/><stop offset="1" stop-color="#040405"/>
  </radialGradient>
  <radialGradient id="bpglow" cx="50%" cy="45%" r="75%">
    <stop offset="0" stop-color="#123563"/><stop offset="1" stop-color="#06142a"/>
  </radialGradient>
  <radialGradient id="vig" cx="50%" cy="50%" r="72%">
    <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/>
  </radialGradient>
  <!-- revelado de la foto: blanco por encima de la línea de escaneo -->
  <linearGradient id="gReveal" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/>
  </linearGradient>
  <linearGradient id="gHide" gradientUnits="userSpaceOnUse" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/>
  </linearGradient>
  <mask id="mReveal" maskUnits="userSpaceOnUse" x="-2000" y="-2000" width="5000" height="5000">
    <rect x="-2000" y="-2000" width="5000" height="5000" fill="url(#gReveal)"/>
  </mask>
  <mask id="mHide" maskUnits="userSpaceOnUse" x="-2000" y="-2000" width="5000" height="5000">
    <rect x="-2000" y="-2000" width="5000" height="5000" fill="url(#gHide)"/>
  </mask>
  <!-- barrido de luz recortado a la silueta real de la pala -->
  <mask id="mRacket" maskUnits="userSpaceOnUse" x="-2000" y="-2000" width="5000" height="5000">
    <image href="assets/alpha_4x.png" x="200" y="270" width="400" height="690"/>
  </mask>
  <linearGradient id="gSweep" gradientUnits="userSpaceOnUse" x1="-0.5" y1="0" x2="0.5" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="gSweepS" gradientUnits="userSpaceOnUse" x1="-0.5" y1="0" x2="0.5" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".32"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="grade">
    <feComponentTransfer>
      <feFuncR type="gamma" amplitude="1.04" exponent="1.18" offset="-0.015"/>
      <feFuncG type="gamma" amplitude="1.04" exponent="1.18" offset="-0.015"/>
      <feFuncB type="gamma" amplitude="1.0" exponent="1.18" offset="-0.02"/>
    </feComponentTransfer>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
</defs>

<!-- fondos -->
<rect id="bgStudio" width="1080" height="1350" fill="url(#spot)"/>
<rect id="bgBp" width="1080" height="1350" fill="url(#bpglow)"/>

<!-- mundo (coordenadas de la foto de producto) -->
<g id="cam">
  <g id="grid"></g>
  <g id="photoG" mask="url(#mReveal)">
    <image id="photo" href="assets/racket_4x.png" x="200" y="270" width="400" height="690"/>
  </g>
  <g id="sweepW" mask="url(#mRacket)">
    <rect id="sweepRect" x="-2000" y="-2000" width="5000" height="5000" fill="url(#gSweep)" style="mix-blend-mode:screen"/>
  </g>
  <g id="bpM" mask="url(#mHide)"><g id="bp" filter="url(#glow)"></g></g>
</g>

<!-- macros reales (espacio de pantalla) -->
<g id="macros"></g>

<!-- capas de pantalla -->
<g id="callouts"></g>
<line id="scan" x1="0" x2="1080" y1="-10" y2="-10" stroke="#8fe3ff" stroke-width="2" filter="url(#glow)"/>
<g id="hud" opacity="0">
  <text class="mono" x="56" y="78">PADEL LOBB · DESIGN STUDY</text>
  <text class="mono" x="56" y="100" id="fig">FIG. 01</text>
  <line x1="56" x2="1024" y1="118" y2="118" stroke="#3d6b9c" stroke-width="1"/>
  <line x1="56" x2="1024" y1="1250" y2="1250" stroke="#3d6b9c" stroke-width="1"/>
  <text class="mono" x="56" y="1278">BELLATOR</text>
  <text class="mono" x="1024" y="1278" text-anchor="end" id="tc">00:00</text>
</g>
<rect width="1080" height="1350" fill="url(#vig)" pointer-events="none"/>
<g id="titles" opacity="0">
  <text id="t1" x="540" y="1262" text-anchor="middle" fill="#f4f1ea" style="font-family:'Inter Display';font-weight:700;font-size:50px;letter-spacing:.32em">BELLATOR</text>
  <text id="t2" x="540" y="1302" text-anchor="middle" fill="#c9a26b" style="font-family:'Inter';font-weight:500;font-size:17px;letter-spacing:.5em">PADEL LOBB</text>
</g>
<rect id="flash" width="1080" height="1350" fill="#eaf6ff" opacity="0"/>
<rect id="black" width="1080" height="1350" fill="#000" opacity="0"/>
</svg>

<script>
const NS='http://www.w3.org/2000/svg', G=window.GEO, W=1080, H=1350, FPS=30;
const $=id=>document.getElementById(id);
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;      // ease in-out cúbico
const eo=t=>1-Math.pow(1-t,3);
const eo4=t=>1-Math.pow(1-t,4);
const mixc=(a,b,t)=>{const p=s=>[1,3,5].map(i=>parseInt(s.substr(i,2),16));const A=p(a),B=p(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')';};

const WHITE='#eaf3ff', CYAN='#6fd0ff', DIM='#3f78b0';
const AX=G.axis;
// Inicio del hero. Entre 10,0 s y H0 va el hueco para planos detalle reales (vídeos de la marca); ahora vacío.
const M0=10.0, H0=10.0;

/* ---------- construcción del blueprint ---------- */
const bp=$('bp'), grid=$('grid');
// cuadrícula técnica en coordenadas de mundo
(function(){
  for(let x=120;x<=680;x+=10) el('line',{x1:x,x2:x,y1:180,y2:1060,stroke:x%50?'#16345c':'#1f4877','stroke-width':x%50?0.6:1,'vector-effect':'non-scaling-stroke'},grid);
  for(let y=180;y<=1060;y+=10) el('line',{x1:120,x2:680,y1:y,y2:y,stroke:y%50?'#16345c':'#1f4877','stroke-width':y%50?0.6:1,'vector-effect':'non-scaling-stroke'},grid);
})();
const strokes=[]; // {e,len,a,b}
function addPath(d,a,b,o={}){
  const e=el('path',{d,fill:'none',stroke:o.c||WHITE,'stroke-width':(o.w||1.6)*1.25,'vector-effect':'non-scaling-stroke','stroke-linejoin':'round','stroke-linecap':'round'},o.parent||bp);
  const len=e.getTotalLength(); const s={e,len,a,b,dash:o.dash};
  strokes.push(s); return s;
}
// trazos discontinuos: se revelan con una máscara de recorrido aparte (dash fijo + opacidad por tramos)
function addDashed(d,a,b,o={}){
  const g=el('g',{},o.parent||bp);
  const e=el('path',{d,fill:'none',stroke:o.c||CYAN,'stroke-width':o.w||1.1,'stroke-dasharray':o.dash||'7 6','vector-effect':'non-scaling-stroke'},g);
  const len=e.getTotalLength();
  // revelado progresivo: un segundo path sólido como máscara no escala bien; usamos clip con dash doble
  e.setAttribute('stroke-dasharray','');
  const pat=(o.dash||'7 6').split(' ').map(Number);
  const s={e,len,a,b,pat,dashed:true}; strokes.push(s); return s;
}
const L=(x1,y1,x2,y2)=>`M${x1},${y1} L${x2},${y2}`;
const circ=(cx,cy,r)=>`M${cx-r},${cy} A${r},${r} 0 1 0 ${cx+r},${cy} A${r},${r} 0 1 0 ${cx-r},${cy}`;

// Escena 1 — primeras líneas: contorno real de la cabeza seguido por la cámara
const sHead=addPath(G.head[0],-0.35,3.1,{w:2.4});
const [acx,acy,ar]=G.arc;
const sArc=addDashed(circ(acx,acy,ar),0.35,2.2,{c:DIM});
const sRad=addDashed(L(acx,acy,acx-ar*Math.cos(.62),acy-ar*Math.sin(.62)),0.9,1.5,{c:CYAN});
const sCen1=addPath(L(acx-8,acy,acx+8,acy),0.8,1.0,{c:CYAN,w:1.2});
const sCen2=addPath(L(acx,acy-8,acx,acy+8),0.85,1.05,{c:CYAN,w:1.2});
// eje de simetría + letras BELLATOR
const sAxis=addDashed(L(AX,262,AX,968),1.5,2.6,{c:CYAN,dash:'14 6 3 6'});
const sText=G.text.map((d,i)=>addPath(d,1.6+i*0.045,2.3+i*0.045,{w:1.3}));
// cota de anchura máxima (sin cifras)
const [wl,wy,wr]=G.widest;
const sW1=addPath(L(wl,wy-30,wl,wy+4),2.05,2.2,{c:CYAN,w:1}), sW2=addPath(L(wr,wy-30,wr,wy+4),2.05,2.2,{c:CYAN,w:1});
const sW=addPath(`M${wl},${wy-22} L${wr},${wy-22} M${wl+7},${wy-26} L${wl},${wy-22} L${wl+7},${wy-18} M${wr-7},${wy-26} L${wr},${wy-22} L${wr-7},${wy-18}`,2.15,2.7,{c:CYAN,w:1.1});
// Escena 2 — agujeros (orden por distancia), manchas del sol, contorno de la cara
const hc=[335,440];
const holesS=G.holes.map(h=>({h,d:Math.hypot(h[0]-hc[0],h[1]-hc[1])})).sort((a,b)=>a.d-b.d);
holesS.forEach((o,i)=>{const [x,y,r]=o.h; o.s=addPath(circ(x,y,r),2.95+i*0.019,3.25+i*0.019,{w:1.3});});
const sSun=G.sun.map((d,i)=>addPath(d,3.1+i*0.09,3.75+i*0.09,{c:CYAN,w:1.3}));
const sFace=addPath(G.face[0],3.6,5.0,{c:WHITE,w:1.2});
// líneas de referencia sobre los agujeros (ejes de una fila y una columna reales)
const hx=holesS.slice(0,6);
const sHr1=addDashed(L(250,hx[0].h[1],520,hx[0].h[1]),3.0,3.6,{c:DIM});
const sHr2=addDashed(L(hx[0].h[0],330,hx[0].h[0],580),3.1,3.7,{c:DIM});
// puente y corazón
const sBridge=addPath(G.bridge[0],4.4,5.2,{c:WHITE,w:1.6});
const sTri=addPath(G.tri[0],4.5,5.1,{c:CYAN,w:1.6});
const tv=G.triv; const ext=(p,q,k)=>[p[0]+(q[0]-p[0])*k,p[1]+(q[1]-p[1])*k];
const sTx=[[0,2],[1,2],[0,1]].map(([i,j],n)=>{const a=ext(tv[j],tv[i],1.9),b=ext(tv[i],tv[j],1.9);return addDashed(L(...a,...b),4.55+n*0.12,5.2+n*0.12,{c:DIM});});
const sLogo=G.logo.map((d,i)=>addPath(d,4.9,5.5,{w:1}));
// mango
const [gx0,gx1]=G.gripx,[gy0,gy1]=G.gripy;
const sGrip=addPath(G.grip[0],5.85,6.75,{w:1.6});
// (el cordón no se traza: su contorno no aporta geometría legible)
const gyc=lerp(gy0,gy1,.55);
const sGd=addPath(`M${gx0-26},${gyc} L${gx1+26},${gyc} M${gx0},${gyc-10} L${gx0},${gyc+10} M${gx1},${gyc-10} L${gx1},${gyc+10}`,6.1,6.6,{c:CYAN,w:1.1});
const sGh=addDashed(L(gx1+34,gy0,gx1+34,gy1),6.2,6.9,{c:DIM});
const sGh2=addPath(`M${gx1+26},${gy0} L${gx1+42},${gy0} M${gx1+26},${gy1} L${gx1+42},${gy1}`,6.2,6.5,{c:CYAN,w:1.1});

/* ---------- cámaras por plano ---------- */
const penPt=(s,p)=>{const q=s.e.getPointAtLength(s.len*clamp(p));return [q.x,q.y];};
const SH=[
  // [inicio, fin, función cámara]
  [0.00,1.53,t=>{const p=seg(t,0,1.53);const pp=penPt(sHead,clamp((t+0.35)/(3.1+0.35)));return {x:lerp(pp[0]+40,pp[0]+18,p),y:lerp(pp[1]+40,pp[1]+30,p),s:lerp(7.2,6.4,p),r:lerp(-6,-3,p)};}],
  [1.53,2.90,t=>{const p=eio(seg(t,1.53,2.9));return {x:lerp(330,452,p),y:lerp(318,330,p),s:lerp(5.6,5.1,p),r:lerp(3,1,p)};}],
  [2.90,4.37,t=>{const p=eio(seg(t,2.9,4.37));return {x:lerp(300,372,p),y:lerp(400,488,p),s:lerp(4.6,4.0,p),r:lerp(-4,-1,p)};}],
  [4.37,5.80,t=>{const p=eo(seg(t,4.37,5.8));return {x:lerp(398,397,p),y:lerp(642,668,p),s:lerp(4.2,6.4,p),r:lerp(2,0,p)};}],
  [5.80,7.25,t=>{const p=eio(seg(t,5.8,7.25));return {x:lerp(395,404,p),y:lerp(770,872,p),s:lerp(4.8,4.3,p),r:lerp(-3,-1,p)};}],
  [7.25,8.60,t=>{const p=eio(seg(t,7.25,8.6));return {x:lerp(378,394,p),y:lerp(400,445,p),s:lerp(3.9,3.3,p),r:lerp(-2,0,p)};}],
  [8.60,10.0,t=>{const p=eio(seg(t,8.6,10));return {x:394,y:lerp(452,520,p),s:lerp(3.1,2.35,p),r:0};}],
  // escena 5 — hero
  [H0,H0+5.5,t=>{const p=eio(seg(t,H0,H0+3.1)),q=seg(t,H0+3.1,H0+5.4);return {x:394,y:lerp(470,612,p),s:lerp(3.0,1.58,p)-0.04*q,r:lerp(-5,0,p)};}],
];
const camAt=t=>{for(const s of SH) if(t>=s[0]&&t<s[1]) return s[2](t); return SH[SH.length-1][2](t);};
let CAM={x:0,y:0,s:1,r:0};
const w2s=(x,y)=>{const c=Math.cos(CAM.r*Math.PI/180),s=Math.sin(CAM.r*Math.PI/180);const dx=(x-CAM.x)*CAM.s,dy=(y-CAM.y)*CAM.s;return [540+dx*c-dy*s,675+dx*s+dy*c];};

/* ---------- etiquetas técnicas (sin cifras inventadas) ---------- */
const callouts=$('callouts');
const CO=[
  // [inicio, fin, punto de mundo, dx, dy, texto]
  [0.45,1.53,()=>[acx,acy-ar],-160,120,'FRAME CONTOUR'],
  [1.75,2.90,()=>[AX,300],150,-110,'AXIS OF SYMMETRY'],
  [2.25,2.90,()=>[(wl+wr)/2,wy-22],120,140,'MAX. WIDTH'],
  [3.20,4.37,()=>[hx[0].h[0]+hx[0].h[2],hx[0].h[1]],170,-150,'HOLE PATTERN'],
  [3.70,4.37,()=>{const d=G.sun[0];return [hx[3].h[0],hx[3].h[1]];},-160,190,'SURFACE GRAPHIC'],
  [4.75,5.80,()=>[tv[2][0],tv[2][1]],170,120,'BRIDGE / HEART'],
  [6.25,7.25,()=>[gx1,gy0+30],170,-90,'HANDLE'],
  [6.55,7.25,()=>[gx1+34,(gy0+gy1)/2],150,120,'GRIP LENGTH'],
];
const coEls=CO.map(c=>{const g=el('g',{opacity:0},callouts);
  const ln=el('polyline',{fill:'none',stroke:CYAN,'stroke-width':1.2},g);
  const dot=el('circle',{r:4,fill:'none',stroke:CYAN,'stroke-width':1.5},g);
  const tx=el('text',{class:'lbl'},g); tx.textContent=c[5];
  return {g,ln,dot,tx};});
function drawCallouts(t){
  CO.forEach((c,i)=>{const E=coEls[i];const a=seg(t,c[0],c[0]+0.35), out=t>=c[1]?0:1;
    const vis=t>=c[0]&&t<c[1];E.g.setAttribute('opacity',vis?Math.min(1,a*1.5):0); if(!vis)return;
    const [px,py]=w2s(...c[2]()); const k=eo(a);
    const ex=px+c[3]*k, ey=py+c[4]*k, hx2=ex+(c[3]>0?150:-150)*eo(seg(t,c[0]+.15,c[0]+.55));
    E.dot.setAttribute('cx',px);E.dot.setAttribute('cy',py);
    E.ln.setAttribute('points',`${px},${py} ${ex},${ey} ${hx2},${ey}`);
    E.tx.setAttribute('x',c[3]>0?ex+6:hx2);E.tx.setAttribute('y',ey-10);
    const n=Math.floor(c[5].length*seg(t,c[0]+.2,c[0]+.6)); E.tx.textContent=c[5].slice(0,n);
  });
}

/* ---------- macros reales (fotos 2–4) ---------- */
const macros=$('macros');
// [inicio, fin, foto, ancho, alto, centro inicial, centro final, ancho de recorte inicial, final, rot inicial, final]
const MS=[]; // aquí entrarán los planos detalle en vídeo
const mEls=MS.map(m=>{const g=el('g',{opacity:0,filter:'url(#grade)'},macros);
  const im=el('image',{href:m[2],width:m[3],height:m[4]},g);
  const sw=el('rect',{x:-0.5,y:-3000,width:1,height:8000,fill:'url(#gSweepS)',style:'mix-blend-mode:screen'},g);
  return {g,im,sw};});
function drawMacros(t){
  MS.forEach((m,i)=>{const E=mEls[i];const vis=t>=m[0]&&t<m[1];E.g.setAttribute('opacity',vis?1:0);if(!vis)return;
    const p=eio(seg(t,m[0],m[1]));const cx=lerp(m[5][0],m[6][0],p),cy=lerp(m[5][1],m[6][1],p),cw=lerp(m[7],m[8],p),r=lerp(m[9],m[10],p);
    const s=W/cw;
    E.im.setAttribute('transform',`translate(540,675) rotate(${r}) scale(${s}) translate(${-cx},${-cy})`);
    // barrido de luz diagonal
    const q=seg(t,m[0]+.2,m[1]-.1); const sx=lerp(-700,1500,eo(q));
    E.sw.setAttribute('transform',`translate(${sx},0) rotate(22) scale(380,1)`);
    E.sw.setAttribute('opacity',(0.25+0.5*Math.sin(Math.PI*q)).toFixed(3));
  });
}

/* ---------- render ---------- */
function setDraw(s,t){
  const p=eo(seg(t,s.a,s.b)); const SL=s.len*CAM.s; // con non-scaling-stroke el trazo se mide en px de pantalla
  if(s.dashed){
    // patrón discontinuo + revelado: patrón repetido hasta p·len, luego hueco
    const tot=SL*p; let arr=[],acc=0,k=0;
    if(p<=0){s.e.setAttribute('stroke-dasharray',`0 ${SL+1}`);return;}
    while(acc<tot){const v=Math.min(s.pat[k%s.pat.length],tot-acc);arr.push(v);acc+=v;k++;}
    if(arr.length%2===1) arr.push(SL+1); else {arr.push(0);arr.push(SL+1);}
    s.e.setAttribute('stroke-dasharray',arr.join(' '));
  } else {
    s.e.setAttribute('stroke-dasharray',`${SL+2} ${SL+2}`);
    s.e.setAttribute('stroke-dashoffset',(SL+2)*(1-p));
  }
}
const FIG=[[0,'FIG. 01 — CONCEPT LINES'],[1.53,'FIG. 02 — SYMMETRY'],[2.9,'FIG. 03 — HOLE PATTERN'],[4.37,'FIG. 04 — BRIDGE'],[5.8,'FIG. 05 — HANDLE'],[7.25,'FIG. 06 — FROM BLUEPRINT TO REALITY']];

window.render=function(t){
  CAM=camAt(t);
  $('cam').setAttribute('transform',`translate(540,675) rotate(${CAM.r}) scale(${CAM.s}) translate(${-CAM.x},${-CAM.y})`);
  strokes.forEach(s=>setDraw(s,t));

  // transición blueprint → realidad (escaneo vertical en mundo)
  const sc=eio(seg(t,7.35,9.35)); const ys=lerp(250,975,sc), F=26;
  const showPhoto=t>=7.3;
  $('photoG').setAttribute('opacity',showPhoto?1:0);
  ['gReveal','gHide'].forEach(id=>{const g=$(id);g.setAttribute('y1',ys-F);g.setAttribute('y2',ys+F);});
  if(t<7.3){$('gHide').setAttribute('y1',-3000);$('gHide').setAttribute('y2',-2999);}
  if(t>=9.35){$('gReveal').setAttribute('y1',4000);$('gReveal').setAttribute('y2',4001);$('gHide').setAttribute('y1',4000);$('gHide').setAttribute('y2',4001);}
  // trazos: atenuar durante la transición y desaparecer del todo
  const bpOp=t<7.3?1:(1-seg(t,8.9,9.5));
  $('bp').setAttribute('opacity',(t>=10?0:bpOp).toFixed(3));
  // línea de escaneo en pantalla
  const scanOn=t>=7.35&&t<9.4; const sy=w2s(394,ys)[1];
  $('scan').setAttribute('y1',sy);$('scan').setAttribute('y2',sy);
  $('scan').setAttribute('opacity',scanOn?(0.9*Math.sin(Math.PI*sc)+0.1).toFixed(3):0);
  // fondos
  const bpBg=1-eio(seg(t,8.3,9.8));
  $('bgBp').setAttribute('opacity',(t<10?bpBg:0).toFixed(3));
  $('grid').setAttribute('opacity',(t<10?(t<7.3?1:1-seg(t,7.6,9.2)):0).toFixed(3));
  // hud de plano técnico
  $('hud').setAttribute('opacity',(t<7.25?seg(t,0.2,0.7):(1-seg(t,7.6,8.6))).toFixed(3));
  let f=FIG[0][1];for(const x of FIG) if(t>=x[0]) f=x[1]; $('fig').textContent=f;
  $('tc').textContent='REV. '+String(Math.min(99,Math.floor(t*3))).padStart(2,'0');
  drawCallouts(t);
  // macros reales y hero
  drawMacros(t);
  const inMacro=t>=M0&&t<H0;
  $('cam').setAttribute('opacity',inMacro?0:1);
  if(t>=H0){$('photoG').setAttribute('opacity',1);}
  // barrido de luz sobre la pala real (en mundo, recortado por la silueta)
  let sw=0,sx=0;
  if(t>=8.9&&t<10){const q=seg(t,8.9,10);sw=Math.sin(Math.PI*q);sx=lerp(150,650,q);}
  if(t>=H0+1.6&&t<H0+3.0){const q=seg(t,H0+1.6,H0+3.0);sw=Math.sin(Math.PI*q);sx=lerp(120,680,eio(q));}
  if(t>=H0+4.0&&t<H0+5.4){const q=seg(t,H0+4.0,H0+5.4);sw=0.5*Math.sin(Math.PI*q);sx=lerp(120,680,q);}
  $('sweepRect').setAttribute('transform',`translate(${sx},0) rotate(18) scale(70,1)`);
  $('sweepRect').setAttribute('x',-0.5);$('sweepRect').setAttribute('width',1);
  $('sweepW').setAttribute('opacity',sw.toFixed(3));
  // títulos finales
  const tt=seg(t,H0+3.4,H0+4.3);
  $('titles').setAttribute('opacity',eo(tt).toFixed(3));
  $('t1').setAttribute('transform',`translate(0,${(1-eo4(tt))*24})`);
  $('t2').setAttribute('transform',`translate(0,${(1-eo4(seg(t,H0+3.65,H0+4.5)))*24})`);
  // destello entre plano 4 y 5, y entrada a macros reales
  const fl=Math.max(1-Math.abs(t-5.8)/0.12, 0.0);
  $('flash').setAttribute('opacity',clamp(fl).toFixed(3));
  // corte suave al hero
  const bk=1-seg(t,H0+0.12,H0+0.5);
  $('black').setAttribute('opacity',(t>=H0?bk:0).toFixed(3));
};
window.DUR=H0+5.4;
if(location.hash!=='#manual'){let t0=performance.now();(function loop(){render(((performance.now()-t0)/1000)%DUR);requestAnimationFrame(loop);})();}
</script>
